name: Packs musée

# Joconde est mise à jour le mercredi : on régénère les packs le jeudi matin et on les publie
# dans une release GitHub. L'app lit https://github.com/<owner>/<repo>/releases/latest/download/manifest.json.
on:
  schedule:
    - cron: "0 5 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Fabriquer les packs
        run: ./gradlew :pack-builder:run --args="--out $GITHUB_WORKSPACE/packs --cache $RUNNER_TEMP/pack-cache" --console=plain
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="packs-$(date -u +%Y-%m-%d)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packs/* --clobber
          else
            gh release create "$tag" packs/* --latest \
              --title "Packs musée du $(date -u +%Y-%m-%d)" \
              --notes "Packs générés depuis la base Joconde (ministère de la Culture, Licence Ouverte 2.0). Voir manifest.json pour les versions et empreintes."
          fi
