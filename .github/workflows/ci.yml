name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    name: Tests JVM + APK debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 pour :pack-builder, 25 pour le démon Gradle (gradle/gradle-daemon-jvm.properties).
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:jvmTest :pack-builder:test :shared:jvmTest :androidApp:assembleDebug --console=plain

  ios:
    name: Tests simulateur iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:iosSimulatorArm64Test --console=plain
